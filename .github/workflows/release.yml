name: Release Scribe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.0"
        required: true
        default: "v0.1.0"
      publish_release:
        description: "Create and publish the GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      WHISPER_CPP_REF: v1.7.6
      FFMPEG_REF: n6.1.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: xcode-27
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles app"
            alias: Scribe.dmg
            aliasGlob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifactName: Scribe-macOS-dry-run
            releaseArtifactName: Scribe-macOS-release
            artifactPath: src-tauri/target/aarch64-apple-darwin/release/bundle
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
            alias: Scribe.exe
            aliasGlob: src-tauri/target/release/bundle/nsis/*.exe
            artifactName: Scribe-Windows-dry-run
            releaseArtifactName: Scribe-Windows-release
            artifactPath: src-tauri/target/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust target
        if: matrix.target == 'aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare macOS runtime binaries
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="src-tauri/resources/bin/${{ matrix.target }}"
          brew update
          brew install cmake pkg-config
          git clone --depth 1 --branch "$FFMPEG_REF" https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          pushd /tmp/ffmpeg
          ./configure \
            --prefix=/tmp/scribe-ffmpeg \
            --arch=arm64 \
            --cc=clang \
            --disable-debug \
            --disable-doc \
            --disable-ffplay \
            --disable-shared \
            --enable-static \
            --disable-autodetect \
            --disable-encoders \
            --enable-encoder=pcm_s16le \
            --disable-decoders \
            --enable-decoder=aac \
            --enable-decoder=mp3 \
            --enable-decoder=opus \
            --enable-decoder=pcm_s16be \
            --enable-decoder=pcm_s16le \
            --enable-decoder=pcm_s24be \
            --enable-decoder=pcm_s24le \
            --enable-decoder=pcm_s32be \
            --enable-decoder=pcm_s32le \
            --enable-decoder=pcm_u8 \
            --disable-muxers \
            --enable-muxer=null \
            --enable-muxer=wav \
            --disable-demuxers \
            --enable-demuxer=aac \
            --enable-demuxer=flac \
            --enable-demuxer=matroska \
            --enable-demuxer=mov \
            --enable-demuxer=mp3 \
            --enable-demuxer=ogg \
            --enable-demuxer=wav \
            --disable-parsers \
            --enable-parser=aac \
            --enable-parser=flac \
            --enable-parser=mpegaudio \
            --enable-parser=opus \
            --disable-protocols \
            --enable-protocol=file \
            --disable-bsfs \
            --disable-devices \
            --disable-filters \
            --enable-filter=aresample \
            --enable-filter=format \
            --enable-filter=anull
          make -j"$(sysctl -n hw.ncpu)"
          make install
          popd
          git clone --depth 1 --branch "$WHISPER_CPP_REF" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8-a -DCMAKE_INSTALL_RPATH=@executable_path
          cmake --build /tmp/whisper.cpp/build --config Release --target whisper-cli
          echo "Discovered whisper.cpp macOS dylibs:"
          find /tmp/whisper.cpp/build -name '*.dylib' -print | sort
          echo "Discovered whisper.cpp whisper-cli binaries:"
          find /tmp/whisper.cpp/build -name whisper-cli -print | sort
          FFMPEG_PATH="/tmp/scribe-ffmpeg/bin/ffmpeg" \
          FFPROBE_PATH="/tmp/scribe-ffmpeg/bin/ffprobe" \
          WHISPER_CLI_PATH="/tmp/whisper.cpp/build/bin/whisper-cli" \
          WHISPER_BUILD_DIR="/tmp/whisper.cpp/build" \
          node scripts/stage-runtime-binaries.mjs "${{ matrix.target }}"
          test -x "$runtime_dir/ffmpeg"
          test -x "$runtime_dir/ffprobe"
          test -x "$runtime_dir/whisper-cli"
          test -n "$(find "$runtime_dir" -maxdepth 1 -name 'libwhisper*.dylib' -print -quit)"
          test -n "$(find "$runtime_dir" -maxdepth 1 -name 'libggml*.dylib' -print -quit)"
          file "$runtime_dir/ffmpeg" "$runtime_dir/ffprobe" "$runtime_dir/whisper-cli"
          "$runtime_dir/ffmpeg" -version
          "$runtime_dir/ffmpeg" -L
          "$runtime_dir/ffprobe" -version
          ! "$runtime_dir/ffmpeg" -version | grep -- '--enable-nonfree'
          ! "$runtime_dir/ffprobe" -version | grep -- '--enable-nonfree'
          otool -L "$runtime_dir/ffmpeg" "$runtime_dir/ffprobe" "$runtime_dir/whisper-cli"
          ! otool -L "$runtime_dir/ffmpeg" "$runtime_dir/ffprobe" "$runtime_dir/whisper-cli" | grep -E '/opt/homebrew|/usr/local'

      - name: Prepare Windows runtime binaries
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install cmake --yes --no-progress
          $runtimeDir = "src-tauri/resources/bin/${{ matrix.target }}"
          $ffmpegZip = "$env:RUNNER_TEMP\ffmpeg-win64-lgpl.zip"
          $ffmpegDir = "$env:RUNNER_TEMP\ffmpeg-win64-lgpl"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegDir
          $ffmpegPath = (Get-ChildItem -Path $ffmpegDir -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobePath = (Get-ChildItem -Path $ffmpegDir -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          if (-not $ffmpegPath) {
            throw "Unable to find ffmpeg.exe in LGPL Windows FFmpeg archive"
          }
          if (-not $ffprobePath) {
            throw "Unable to find ffprobe.exe in LGPL Windows FFmpeg archive"
          }
          git clone --depth 1 --branch $env:WHISPER_CPP_REF https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP\whisper.cpp"
          cmake -S "$env:RUNNER_TEMP\whisper.cpp" -B "$env:RUNNER_TEMP\whisper.cpp\build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build "$env:RUNNER_TEMP\whisper.cpp\build" --config Release --target whisper-cli
          $env:FFMPEG_PATH = $ffmpegPath
          $env:FFPROBE_PATH = $ffprobePath
          $candidates = @(
            "$env:RUNNER_TEMP\whisper.cpp\build\bin\Release\whisper-cli.exe",
            "$env:RUNNER_TEMP\whisper.cpp\build\bin\whisper-cli.exe",
            "$env:RUNNER_TEMP\whisper.cpp\build\examples\cli\Release\whisper-cli.exe"
          )
          $env:WHISPER_CLI_PATH = ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)
          if (-not $env:WHISPER_CLI_PATH) {
            throw "Unable to find built whisper-cli.exe"
          }
          node scripts/stage-runtime-binaries.mjs "${{ matrix.target }}"
          if (-not (Test-Path "$runtimeDir/ffmpeg.exe" -PathType Leaf)) {
            throw "Missing staged ffmpeg.exe"
          }
          if (-not (Test-Path "$runtimeDir/ffprobe.exe" -PathType Leaf)) {
            throw "Missing staged ffprobe.exe"
          }
          if (-not (Test-Path "$runtimeDir/whisper-cli.exe" -PathType Leaf)) {
            throw "Missing staged whisper-cli.exe"
          }
          & "$runtimeDir/ffmpeg.exe" -version
          & "$runtimeDir/ffprobe.exe" -version
          if ((& "$runtimeDir/ffmpeg.exe" -version) -match "--enable-nonfree") {
            throw "ffmpeg.exe was built with --enable-nonfree"
          }
          if ((& "$runtimeDir/ffprobe.exe" -version) -match "--enable-nonfree") {
            throw "ffprobe.exe was built with --enable-nonfree"
          }

      - name: Build signed Tauri bundles for workflow artifact
        if: matrix.target == 'x86_64-pc-windows-msvc' && github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload dry-run Tauri artifacts
        if: matrix.target == 'x86_64-pc-windows-msvc' && github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

      - name: Build macOS release bundle for runtime verification
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Verify Xcode 27 for modern macOS icons
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcode_version="$(xcodebuild -version)"
          echo "$xcode_version"
          xcode_major="$(printf '%s\n' "$xcode_version" | awk '/^Xcode / { split($2, parts, "."); print parts[1]; exit }')"
          if [ "$xcode_major" != "27" ]; then
            echo "Expected Xcode 27.x for frozen Icon Composer source, got:"
            echo "$xcode_version"
            exit 1
          fi
          xcrun --sdk macosx --show-sdk-version
          xcrun --find actool
          sw_vers

      - name: Verify modern macOS icon toolchain
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: npm run icon:macos:verify-toolchain

      - name: Compile and apply final modern macOS icon
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scribe.app"
          macos_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          test -d "$app_path"
          npm run icon:macos:compile
          npm run icon:macos:apply -- --app="$app_path"
          rm -f "$macos_dir"/*.app.tar.gz "$macos_dir"/*.app.tar.gz.sig

      - name: Sign final macOS app after icon injection
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scribe.app"
          codesign --force --deep --options runtime --sign - "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Create updater archive from final signed macOS app
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          macos_dir="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          tar_path="$macos_dir/Scribe.app.tar.gz"
          test -d "$macos_dir/Scribe.app"
          tar -C "$macos_dir" -czf "$tar_path" Scribe.app
          ./node_modules/.bin/tauri signer sign "$tar_path" \
            | awk '/^Public signature:/{getline; print; exit}' \
            | tr -d '\r\n[:space:]' > "$tar_path.sig"
          test -s "$tar_path"
          test -s "$tar_path.sig"
          ! grep -Eq 'Your file was signed successfully|Public signature:|Make sure to include' "$tar_path.sig"

      - name: Verify final macOS app and updater icon resources
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: npm run icon:macos:verify-final-app

      - name: Build deterministic macOS release DMG
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: node scripts/build-release-dmg.mjs

      - name: Build Windows release bundle
        if: matrix.target == 'x86_64-pc-windows-msvc' && (github.event_name == 'push' || inputs.publish_release == true)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Verify release macOS app runtime resources before upload
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scribe.app"
          bundled_dir="$app_path/Contents/Resources/bin/${{ matrix.target }}"
          test -d "$bundled_dir"
          test -x "$bundled_dir/ffmpeg"
          test -x "$bundled_dir/ffprobe"
          test -x "$bundled_dir/whisper-cli"
          test -n "$(find "$bundled_dir" -maxdepth 1 -name 'libwhisper*.dylib' -print -quit)"
          test -n "$(find "$bundled_dir" -maxdepth 1 -name 'libggml*.dylib' -print -quit)"
          find "$app_path" -type f | grep -E 'ffmpeg|ffprobe|whisper'
          ls -l "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli"
          file "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli"
          "$bundled_dir/ffmpeg" -version
          "$bundled_dir/ffprobe" -version
          ! "$bundled_dir/ffmpeg" -version | grep -- '--enable-nonfree'
          ! "$bundled_dir/ffprobe" -version | grep -- '--enable-nonfree'
          otool -L "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli"
          ! otool -L "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli" | grep -E '/opt/homebrew|/usr/local'

      - name: Verify macOS release app runtime resources
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          app_path="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Scribe.app"
          bundled_dir="$app_path/Contents/Resources/bin/${{ matrix.target }}"
          test -d "$bundled_dir"
          test -x "$bundled_dir/ffmpeg"
          test -x "$bundled_dir/ffprobe"
          test -x "$bundled_dir/whisper-cli"
          test -n "$(find "$bundled_dir" -maxdepth 1 -name 'libwhisper*.dylib' -print -quit)"
          test -n "$(find "$bundled_dir" -maxdepth 1 -name 'libggml*.dylib' -print -quit)"
          find "$app_path" -type f | grep -E 'ffmpeg|ffprobe|whisper'
          ls -l "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli"
          file "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli"
          otool -L "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli"
          ! otool -L "$bundled_dir/ffmpeg" "$bundled_dir/ffprobe" "$bundled_dir/whisper-cli" | grep -E '/opt/homebrew|/usr/local'

      - name: Verify macOS release DMG layout assets
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail

          volume_path=""
          cleanup() {
            local original_status=$?
            if [ -n "${volume_path:-}" ] && [ -d "$volume_path" ]; then
              if hdiutil detach "$volume_path"; then
                echo "PASS: DMG ejected"
              else
                echo "FAIL: DMG eject failed"
                if [ "$original_status" -eq 0 ]; then
                  exit 1
                fi
              fi
            fi
            exit "$original_status"
          }
          trap cleanup EXIT

          fail() {
            echo "FAIL: $1"
            exit 1
          }

          pass() {
            echo "PASS: $1"
          }

          shopt -s nullglob
          dmg_candidates=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmg_candidates[@]} -ne 1 ]; then
            echo "FAIL: Expected exactly one generated DMG, found ${#dmg_candidates[@]}"
            printf '%s\n' "${dmg_candidates[@]}"
            exit 1
          fi
          dmg_path="${dmg_candidates[0]}"
          pass "DMG found: $dmg_path"

          mount_output="$(hdiutil attach "$dmg_path" -nobrowse -readonly)"
          echo "$mount_output"
          volume_path="$(printf '%s\n' "$mount_output" | awk '$NF ~ "^/Volumes/" { volume=$NF } END { print volume }')"
          [ -n "$volume_path" ] || fail "DMG mount point was not found in hdiutil output"
          [ -d "$volume_path" ] || fail "DMG mount point does not exist: $volume_path"
          pass "DMG mounted: $volume_path"

          [ -d "$volume_path/Scribe.app" ] || fail "Scribe.app not found at $volume_path/Scribe.app"
          pass "Scribe.app found"

          resources_dir="$volume_path/Scribe.app/Contents/Resources"
          info_plist="$volume_path/Scribe.app/Contents/Info.plist"
          executable="$volume_path/Scribe.app/Contents/MacOS/scribe-app"
          [ -s "$resources_dir/Assets.car" ] || fail "Assets.car not found or empty in DMG app"
          [ -s "$resources_dir/Scribe.icns" ] || fail "Scribe.icns not found or empty in DMG app"
          [ -s "$resources_dir/icon.icns" ] || fail "legacy icon.icns not found or empty in DMG app"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$info_plist")" = "Scribe" ] || fail "CFBundleIconName is not Scribe in DMG app"
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$info_plist")" = "Scribe" ] || fail "CFBundleIconFile is not Scribe in DMG app"
          file "$executable" | grep -F 'arm64' >/dev/null || fail "DMG app executable is not arm64"
          codesign --verify --deep --strict --verbose=2 "$volume_path/Scribe.app" || fail "DMG app codesign verification failed"
          pass "DMG app icon resources and signature verified"

          [ -L "$volume_path/Applications" ] || fail "Applications symlink not found at $volume_path/Applications"
          applications_target="$(readlink "$volume_path/Applications")"
          [ "$applications_target" = "/Applications" ] || fail "Applications symlink points to $applications_target instead of /Applications"
          pass "Applications symlink found"

          [ -f "$volume_path/.background/dmg-background.png" ] || fail "background not found at $volume_path/.background/dmg-background.png"
          pass "background found"

          [ -s "$volume_path/.DS_Store" ] || fail ".DS_Store not found or empty at $volume_path/.DS_Store"
          pass ".DS_Store found"
          strings "$volume_path/.DS_Store" | grep -F '/.background/dmg-background.png' >/dev/null || fail ".DS_Store does not reference /.background/dmg-background.png"
          pass ".DS_Store references background"

          shasum -a 256 "$dmg_path"
          if hdiutil detach "$volume_path"; then
            volume_path=""
            pass "DMG ejected"
          else
            fail "DMG eject failed"
          fi
          pass "macOS DMG structural verification complete"

      - name: Upload release bundle artifacts
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.releaseArtifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

      - name: Upload macOS dry-run release pipeline artifacts
        if: matrix.target == 'aarch64-apple-darwin' && github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

  publish:
    name: Publish release assets
    needs: build
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: Scribe-*-release

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          Scribe v0.1.14 improves transcription reliability.

          This release conservatively reduces obvious repeated-phrase hallucination loops while preserving legitimate repetition, such as natural repeated words. It also includes stability and reliability improvements.
          EOF
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Scribe $TAG_NAME" --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" --title "Scribe $TAG_NAME" --notes-file release-notes.md --generate-notes
          fi

      - name: Stage release assets and updater manifest
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-upload
          release_version="${TAG_NAME#v}"
          package_version="$(jq -r '.version' package.json)"
          tauri_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo_version="$(awk -F ' *= *' '/^version = / { gsub(/"/, "", $2); print $2; exit }' src-tauri/Cargo.toml)"

          if [ "$release_version" != "$package_version" ]; then
            echo "Release tag version ($release_version) does not match package.json version ($package_version)"
            exit 1
          fi
          if [ "$release_version" != "$tauri_version" ]; then
            echo "Release tag version ($release_version) does not match tauri.conf.json version ($tauri_version)"
            exit 1
          fi
          if [ "$release_version" != "$cargo_version" ]; then
            echo "Release tag version ($release_version) does not match Cargo.toml version ($cargo_version)"
            exit 1
          fi

          mac_tar_candidates=(release-artifacts/Scribe-macOS-release/macos/*.app.tar.gz)
          mac_sig_candidates=(release-artifacts/Scribe-macOS-release/macos/*.app.tar.gz.sig)
          mac_dmg_candidates=(release-artifacts/Scribe-macOS-release/dmg/*.dmg)
          win_exe_candidates=(release-artifacts/Scribe-Windows-release/nsis/*.exe)
          win_sig_candidates=(release-artifacts/Scribe-Windows-release/nsis/*.exe.sig)

          if [ ${#mac_tar_candidates[@]} -ne 1 ]; then
            echo "Expected exactly one macOS updater .app.tar.gz, found ${#mac_tar_candidates[@]}"
            printf '%s\n' "${mac_tar_candidates[@]}"
            exit 1
          fi
          if [ ${#mac_sig_candidates[@]} -ne 1 ]; then
            echo "Expected exactly one macOS updater .app.tar.gz.sig, found ${#mac_sig_candidates[@]}"
            printf '%s\n' "${mac_sig_candidates[@]}"
            exit 1
          fi
          if [ ${#mac_dmg_candidates[@]} -ne 1 ]; then
            echo "Expected exactly one macOS .dmg, found ${#mac_dmg_candidates[@]}"
            printf '%s\n' "${mac_dmg_candidates[@]}"
            exit 1
          fi
          if [ ${#win_exe_candidates[@]} -ne 1 ]; then
            echo "Expected exactly one Windows NSIS .exe, found ${#win_exe_candidates[@]}"
            printf '%s\n' "${win_exe_candidates[@]}"
            exit 1
          fi
          if [ ${#win_sig_candidates[@]} -ne 1 ]; then
            echo "Expected exactly one Windows NSIS .exe.sig, found ${#win_sig_candidates[@]}"
            printf '%s\n' "${win_sig_candidates[@]}"
            exit 1
          fi

          mac_tar="${mac_tar_candidates[0]}"
          mac_sig="${mac_sig_candidates[0]}"
          mac_dmg="${mac_dmg_candidates[0]}"
          win_exe="${win_exe_candidates[0]}"
          win_sig="${win_sig_candidates[0]}"

          test -s "$mac_tar"
          test -s "$mac_sig"
          test -s "$mac_dmg"
          test -s "$win_exe"
          test -s "$win_sig"

          cp "$mac_tar" release-upload/
          cp "$mac_sig" release-upload/
          cp "$mac_dmg" release-upload/
          cp "$win_exe" release-upload/
          cp "$win_sig" release-upload/
          cp "$mac_dmg" release-upload/Scribe.dmg
          cp "$win_exe" release-upload/Scribe.exe

          mac_tar_name="$(basename "$mac_tar")"
          win_exe_name="$(basename "$win_exe")"
          mac_signature="$(tr -d '\r\n[:space:]' < "$mac_sig")"
          win_signature="$(tr -d '\r\n[:space:]' < "$win_sig")"

          if [ -z "$mac_signature" ]; then
            echo "macOS updater signature is empty"
            exit 1
          fi
          if [ -z "$win_signature" ]; then
            echo "Windows updater signature is empty"
            exit 1
          fi
          for signature in "$mac_sig" "$win_sig"; do
            if grep -Eq 'Your file was signed successfully|Public signature:|Make sure to include|[[:space:]]' "$signature"; then
              echo "Updater signature contains prose or whitespace: $signature"
              exit 1
            fi
            if ! printf '%s' "$(cat "$signature")" | base64 --decode >/dev/null 2>&1; then
              echo "Updater signature is not valid base64: $signature"
              exit 1
            fi
          done

          updater_pubkey="$(jq -r '.plugins.updater.pubkey' src-tauri/tauri.conf.json)"
          node scripts/verify-updater-signature.mjs "$mac_tar" "$mac_sig" "$updater_pubkey"
          node scripts/verify-updater-signature.mjs "$win_exe" "$win_sig" "$updater_pubkey"

          jq -n \
            --arg version "$release_version" \
            --arg notes "Scribe v0.1.14 improves transcription reliability.\n\nThis release conservatively reduces obvious repeated-phrase hallucination loops while preserving legitimate repetition, such as natural repeated words. It also includes stability and reliability improvements." \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg mac_url "https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${mac_tar_name}" \
            --arg mac_signature "$mac_signature" \
            --arg win_url "https://github.com/${REPOSITORY}/releases/download/${TAG_NAME}/${win_exe_name}" \
            --arg win_signature "$win_signature" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  signature: $mac_signature,
                  url: $mac_url
                },
                "windows-x86_64": {
                  signature: $win_signature,
                  url: $win_url
                },
                "windows-x86_64-nsis": {
                  signature: $win_signature,
                  url: $win_url
                }
              }
            }' > release-upload/latest.json

          jq -e '
            .version == $version and
            (.platforms["darwin-aarch64"].url | endswith(".app.tar.gz")) and
            (.platforms["darwin-aarch64"].signature | length > 0) and
            (.platforms["windows-x86_64"].url | endswith(".exe")) and
            (.platforms["windows-x86_64"].signature | length > 0) and
            (.platforms["windows-x86_64-nsis"].url | endswith(".exe")) and
            (.platforms["windows-x86_64-nsis"].signature | length > 0)
          ' --arg version "$release_version" release-upload/latest.json
          jq -e \
            --arg mac_name "$mac_tar_name" \
            --arg mac_signature "$mac_signature" \
            --arg win_name "$win_exe_name" \
            --arg win_signature "$win_signature" \
            '(.platforms["darwin-aarch64"].url | endswith($mac_name)) and
             .platforms["darwin-aarch64"].signature == $mac_signature and
             (.platforms["windows-x86_64"].url | endswith($win_name)) and
             .platforms["windows-x86_64"].signature == $win_signature and
             .platforms["windows-x86_64-nsis"].signature == $win_signature' \
            release-upload/latest.json
          jq -r '.platforms[].signature' release-upload/latest.json | while IFS= read -r signature; do
            if [ "$signature" != "$(printf '%s' "$signature" | tr -d '\r\n[:space:]')" ]; then
              echo "Manifest signature contains whitespace"
              exit 1
            fi
            if grep -Eq 'Your file was signed successfully|Public signature:|Make sure to include' <<< "$signature"; then
              echo "Manifest signature contains signer prose"
              exit 1
            fi
            printf '%s' "$signature" | base64 --decode >/dev/null 2>&1 || {
              echo "Manifest signature is not valid base64"
              exit 1
            }
          done

          echo "Prepared release assets:"
          find release-upload -maxdepth 1 -type f -print | sort
          echo "Prepared latest.json:"
          jq . release-upload/latest.json

      - name: Upload release assets and latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Replace stable website aliases with fresh release assets instead of
          # relying only on --clobber, which can leave latest/download clients
          # seeing a stale asset through GitHub's release-asset cache.
          gh release delete-asset "$TAG_NAME" Scribe.dmg --yes || true
          gh release delete-asset "$TAG_NAME" Scribe.exe --yes || true
          gh release upload "$TAG_NAME" \
            release-upload/*.dmg \
            release-upload/*.exe \
            release-upload/*.app.tar.gz \
            release-upload/*.sig \
            --clobber
          gh release upload "$TAG_NAME" release-upload/latest.json --clobber
