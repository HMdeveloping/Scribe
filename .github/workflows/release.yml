name: Release Scribe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.1.0"
        required: true
        default: "v0.1.0"
      publish_release:
        description: "Create and publish the GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      WHISPER_CPP_REF: v1.7.6
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"
            alias: Scribe-macOS.dmg
            aliasGlob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            artifactName: Scribe-macOS-dry-run
            artifactPath: src-tauri/target/aarch64-apple-darwin/release/bundle
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
            alias: Scribe-Windows.exe
            aliasGlob: src-tauri/target/release/bundle/nsis/*.exe
            artifactName: Scribe-Windows-dry-run
            artifactPath: src-tauri/target/release/bundle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust target
        if: matrix.target == 'aarch64-apple-darwin'
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare macOS runtime binaries
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install ffmpeg cmake
          git clone --depth 1 --branch "$WHISPER_CPP_REF" https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8-a
          cmake --build /tmp/whisper.cpp/build --config Release --target whisper-cli
          FFMPEG_PATH="$(command -v ffmpeg)" \
          FFPROBE_PATH="$(command -v ffprobe)" \
          WHISPER_CLI_PATH="/tmp/whisper.cpp/build/bin/whisper-cli" \
          node scripts/stage-runtime-binaries.mjs "${{ matrix.target }}"

      - name: Prepare Windows runtime binaries
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ffmpeg cmake --yes --no-progress
          git clone --depth 1 --branch $env:WHISPER_CPP_REF https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP\whisper.cpp"
          cmake -S "$env:RUNNER_TEMP\whisper.cpp" -B "$env:RUNNER_TEMP\whisper.cpp\build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build "$env:RUNNER_TEMP\whisper.cpp\build" --config Release --target whisper-cli
          $env:FFMPEG_PATH = (Get-Command ffmpeg.exe).Source
          $env:FFPROBE_PATH = (Get-Command ffprobe.exe).Source
          $candidates = @(
            "$env:RUNNER_TEMP\whisper.cpp\build\bin\Release\whisper-cli.exe",
            "$env:RUNNER_TEMP\whisper.cpp\build\bin\whisper-cli.exe",
            "$env:RUNNER_TEMP\whisper.cpp\build\examples\cli\Release\whisper-cli.exe"
          )
          $env:WHISPER_CLI_PATH = ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)
          if (-not $env:WHISPER_CLI_PATH) {
            throw "Unable to find built whisper-cli.exe"
          }
          node scripts/stage-runtime-binaries.mjs "${{ matrix.target }}"

      - name: Build signed Tauri bundles for workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload dry-run Tauri artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release != true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.artifactPath }}
          if-no-files-found: error

      - name: Build and upload Tauri release assets
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Scribe ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Initial Scribe desktop release.

            This release may be unsigned or not notarized until platform signing is configured.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Upload stable website download alias
        if: github.event_name == 'push' || inputs.publish_release == true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
          ALIAS: ${{ matrix.alias }}
          ALIAS_GLOB: ${{ matrix.aliasGlob }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( $ALIAS_GLOB )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer matched $ALIAS_GLOB"
            exit 1
          fi
          cp "${files[0]}" "$ALIAS"
          gh release upload "$TAG_NAME" "$ALIAS" --clobber
