name: Windows x64 Microsoft Store MSIX Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WHISPER_CPP_REF: v1.7.6
  VULKAN_SDK_VERSION: 1.4.341.0

jobs:
  build-windows-store-msix:
    name: Build Scribe v0.1.25 x64 MSIX
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare runtime and build application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install cmake --yes --no-progress
          choco install vulkan-sdk --version=1.4.341 --yes --no-progress
          $vulkanSdk = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          if (-not (Test-Path "$vulkanSdk\Include\vulkan\vulkan.h")) { throw "Vulkan headers missing" }
          $glslc = Get-ChildItem -Path $vulkanSdk -Recurse -Filter glslc.exe -File | Select-Object -First 1
          if (-not $glslc) { throw "glslc.exe missing" }
          $env:VULKAN_SDK = $vulkanSdk
          $env:Path = "$($glslc.Directory.FullName);$vulkanSdk\Bin;$env:Path"
          $runtimeDir = "src-tauri/resources/bin/x86_64-pc-windows-msvc"
          $ffmpegZip = "$env:RUNNER_TEMP\ffmpeg-win64-lgpl.zip"
          $ffmpegDir = "$env:RUNNER_TEMP\ffmpeg-win64-lgpl"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile $ffmpegZip
          Expand-Archive -Path $ffmpegZip -DestinationPath $ffmpegDir
          $ffmpegPath = (Get-ChildItem -Path $ffmpegDir -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobePath = (Get-ChildItem -Path $ffmpegDir -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          if (-not $ffmpegPath -or -not $ffprobePath) { throw "FFmpeg runtime missing" }
          git clone --depth 1 --branch $env:WHISPER_CPP_REF https://github.com/ggml-org/whisper.cpp.git "$env:RUNNER_TEMP\whisper.cpp"
          cmake -S "$env:RUNNER_TEMP\whisper.cpp" -B "$env:RUNNER_TEMP\whisper.cpp\build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DGGML_VULKAN=ON -DVulkan_ROOT="$env:VULKAN_SDK"
          cmake --build "$env:RUNNER_TEMP\whisper.cpp\build" --config Release --target whisper-cli
          $env:FFMPEG_PATH = $ffmpegPath
          $env:FFPROBE_PATH = $ffprobePath
          $env:WHISPER_BUILD_DIR = "$env:RUNNER_TEMP\whisper.cpp\build"
          $candidates = @(
            "$env:RUNNER_TEMP\whisper.cpp\build\bin\Release\whisper-cli.exe",
            "$env:RUNNER_TEMP\whisper.cpp\build\bin\whisper-cli.exe",
            "$env:RUNNER_TEMP\whisper.cpp\build\examples\cli\Release\whisper-cli.exe"
          )
          $env:WHISPER_CLI_PATH = ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)
          if (-not $env:WHISPER_CLI_PATH) { throw "whisper-cli.exe missing" }
          node scripts/stage-runtime-binaries.mjs x86_64-pc-windows-msvc
          $env:SCRIBE_CHANNEL = "microsoft-store"
          $env:VITE_SCRIBE_CHANNEL = "microsoft-store"
          npm run build
          npm run tauri build -- --config src-tauri/tauri.microsoftstore.conf.json --bundles nsis
          $builtExe = Get-ChildItem "src-tauri\target\release" -Filter "*.exe" -File | Where-Object { $_.Name -notlike "*-setup.exe" } | Select-Object -First 1
          if (-not $builtExe) { throw "Scribe application executable missing from release payload" }
          $env:SCRIBE_BUILT_EXE = $builtExe.FullName
          "SCRIBE_BUILT_EXE=$($builtExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path "$runtimeDir\ggml-vulkan.dll")) { throw "ggml-vulkan.dll missing" }

      - name: Assemble and validate MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $payload = "$env:RUNNER_TEMP\scribe-msix-payload"
          $assets = "$payload\Assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          Copy-Item $env:SCRIBE_BUILT_EXE "$payload\Scribe.exe"
          if (Test-Path "src-tauri\target\release\resources") {
            Copy-Item "src-tauri\target\release\resources" "$payload\resources" -Recurse
          } else {
            New-Item -ItemType Directory -Force -Path "$payload\resources" | Out-Null
            Copy-Item "src-tauri\resources\bin" "$payload\resources\bin" -Recurse
            Copy-Item "THIRD_PARTY_NOTICES.md" "$payload\resources\THIRD_PARTY_NOTICES.md"
          }
          Copy-Item "src-tauri\icons\StoreLogo.png" "$assets\StoreLogo.png"
          Copy-Item "src-tauri\icons\Square150x150Logo.png" "$assets\Square150x150Logo.png"
          Copy-Item "src-tauri\icons\Square44x44Logo.png" "$assets\Square44x44Logo.png"
          Copy-Item "scripts\windows-store\AppxManifest.xml" "$payload\AppxManifest.xml"
          [xml]$preflightManifest = Get-Content "$payload\AppxManifest.xml"
          $manifestRoot = $preflightManifest.Package
          $namespaceManager = New-Object System.Xml.XmlNamespaceManager($preflightManifest.NameTable)
          $namespaceManager.AddNamespace("appx", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $namespaceManager.AddNamespace("uap10", "http://schemas.microsoft.com/appx/manifest/uap/windows10/10")
          $namespaceManager.AddNamespace("rescap", "http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities")
          $application = $preflightManifest.SelectSingleNode("/appx:Package/appx:Applications/appx:Application", $namespaceManager)
          $capabilities = $preflightManifest.SelectNodes("/appx:Package/appx:Capabilities", $namespaceManager)
          $runFullTrust = $preflightManifest.SelectSingleNode("/appx:Package/appx:Capabilities/rescap:Capability[@Name='runFullTrust']", $namespaceManager)
          $microphone = $preflightManifest.SelectSingleNode("/appx:Package/appx:Capabilities/appx:DeviceCapability[@Name='microphone']", $namespaceManager)
          if (-not $manifestRoot.GetAttribute("rescap", "http://www.w3.org/2000/xmlns/")) { throw "MSIX manifest preflight failed: rescap namespace is missing" }
          if ($capabilities.Count -ne 1) { throw "MSIX manifest preflight failed: expected exactly one Capabilities block" }
          $capabilityChildren = $capabilities[0].ChildNodes
          if (-not $runFullTrust) { throw "MSIX manifest preflight failed: runFullTrust capability is missing" }
          if (-not $microphone) { throw "MSIX manifest preflight failed: microphone DeviceCapability is missing" }
          if ($capabilityChildren.Count -ne 2 -or $capabilityChildren[0].NamespaceURI -ne "http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities" -or $capabilityChildren[0].LocalName -ne "Capability" -or $capabilityChildren[0].GetAttribute("Name") -ne "runFullTrust" -or $capabilityChildren[1].NamespaceURI -ne "http://schemas.microsoft.com/appx/manifest/foundation/windows10" -or $capabilityChildren[1].LocalName -ne "DeviceCapability" -or $capabilityChildren[1].GetAttribute("Name") -ne "microphone") { throw "MSIX manifest preflight failed: expected rescap runFullTrust before microphone DeviceCapability" }
          if (-not $application -or $application.GetAttribute("RuntimeBehavior", "http://schemas.microsoft.com/appx/manifest/uap/windows10/10") -ne "packagedClassicApp" -or $application.GetAttribute("TrustLevel", "http://schemas.microsoft.com/appx/manifest/uap/windows10/10") -ne "mediumIL") { throw "MSIX manifest preflight failed: packagedClassicApp/mediumIL declaration is missing" }
          Write-Host "MSIX manifest preflight passed: rescap/runFullTrust and packagedClassicApp/mediumIL are present."
          $makeAppx = $null
          $pathCommand = Get-Command MakeAppx.exe -ErrorAction SilentlyContinue
          if ($pathCommand) {
            $makeAppx = $pathCommand.Source
            Write-Host "MakeAppx.exe found on PATH: $makeAppx"
          }
          if (-not $makeAppx) {
            $sdkRoots = @()
            foreach ($candidateRoot in @(
              $env:WindowsSdkDir,
              $env:WindowsSdkVerBinPath,
              "$env:ProgramFiles\Windows Kits\10",
              "${env:ProgramFiles(x86)}\Windows Kits\10"
            )) {
              if ($candidateRoot -and (Test-Path -LiteralPath $candidateRoot)) {
                $sdkRoots += $candidateRoot
              }
            }
            $installedRootsKey = "HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots"
            if (Test-Path -LiteralPath $installedRootsKey) {
              $installedRoots = Get-ItemProperty -LiteralPath $installedRootsKey
              foreach ($property in $installedRoots.PSObject.Properties) {
                if ($property.Name -like "KitsRoot*" -and $property.Value -and (Test-Path -LiteralPath $property.Value)) {
                  $sdkRoots += $property.Value
                }
              }
            }
            $sdkRoots = $sdkRoots | Sort-Object -Unique
            $makeAppxCandidates = @()
            foreach ($sdkRoot in $sdkRoots) {
              $binRoot = Join-Path $sdkRoot "bin"
              if (Test-Path -LiteralPath $binRoot) {
                $makeAppxCandidates += Get-ChildItem -LiteralPath $binRoot -Recurse -Filter MakeAppx.exe -File -ErrorAction SilentlyContinue
              }
            }
            $makeAppxCandidate = $makeAppxCandidates |
              Sort-Object @{ Expression = { if ($_.FullName -match "\\x64\\") { 0 } else { 1 } } }, FullName -Descending |
              Select-Object -First 1
            if ($makeAppxCandidate) {
              $makeAppx = $makeAppxCandidate.FullName
              Write-Host "MakeAppx.exe selected from Windows SDK: $makeAppx"
            }
          }
          if (-not $makeAppx) {
            Write-Host "Runner architecture: $env:PROCESSOR_ARCHITECTURE"
            throw "Official Windows SDK MakeAppx.exe was not found on this runner."
          }
          Write-Host "Selected MakeAppx.exe: $makeAppx"
          $artifact = "$env:GITHUB_WORKSPACE\Scribe-v0.1.25-Windows-x64.msix"
          & $makeAppx pack /d $payload /p $artifact /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed" }
          $unpack = "$env:RUNNER_TEMP\scribe-msix-unpack"
          & $makeAppx unpack /p $artifact /d $unpack /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx unpack failed" }
          [xml]$manifest = Get-Content "$unpack\AppxManifest.xml"
          $identity = $manifest.Package.Identity
          if ($identity.Name -ne "MHDeveloping.ScribeforWindows" -or $identity.Publisher -ne "CN=0AE4EB60-E72D-4CB9-B2CF-D519F5C9ECA4" -or $identity.Version -ne "0.1.25.0" -or $identity.ProcessorArchitecture -ne "x64") { throw "MSIX identity validation failed" }
          if (-not (Test-Path "$unpack\Scribe.exe")) { throw "MSIX executable missing" }
          foreach ($required in @("ffmpeg.exe", "ffprobe.exe", "whisper-cli.exe", "ggml.dll", "ggml-vulkan.dll")) {
            if (-not (Get-ChildItem $unpack -Recurse -Filter $required -File)) { throw "MSIX missing $required" }
          }
          if (Get-ChildItem $unpack -Recurse -Include *.pfx,*.key,*.pem -File) { throw "Signing material found in MSIX" }

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scribe-v0.1.25-MicrosoftStore-MSIX-x64
          path: Scribe-v0.1.25-Windows-x64.msix
          if-no-files-found: error
